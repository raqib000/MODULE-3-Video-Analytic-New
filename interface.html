<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming Interface</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: #0a0f1f;
        font-family: 'Orbitron', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #00eaff;
        overflow: hidden;
    }

    .container {
        text-align: center;
        padding: 40px;
        border: 2px solid #00eaff;
        border-radius: 20px;
        box-shadow: 0 0 25px #00eaff;
        background: rgba(0, 0, 0, 0.4);
        width: 380px;
        backdrop-filter: blur(6px);
    }

    h1 {
        margin-bottom: 20px;
        font-size: 32px;
        text-shadow: 0 0 15px #00eaff;
    }

    .btn {
        display: block;
        margin: 15px auto;
        width: 200px;
        padding: 12px;
        border: none;
        font-size: 18px;
        color: white;
        background: #ff0077;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 0 15px #ff0077;
    }

    .btn:hover {
        background: #ff2e9a;
        box-shadow: 0 0 30px #ff2e9a;
        transform: scale(1.08);
    }

    /* Neon grid background */
    .grid {
        position: absolute;
        width: 200%;
        height: 200%;
        background:
          linear-gradient(#0ff1 1px, transparent 1px),
          linear-gradient(90deg, #0ff1 1px, transparent 1px);
        background-size: 40px 40px;
        animation: moveGrid 10s linear infinite;
        opacity: 0.15;
    }

    @keyframes moveGrid {
        from { transform: translateY(0); }
        to { transform: translateY(40px); }
    }

</style>
</head>

<body>

<div class="grid"></div>

<div class="container">
    <h1>GAMING UI</h1>
    <button class="btn" onclick="alert('Start Game!')">Start Game</button>
    <button class="btn" onclick="alert('Loading Options...')">Options</button>
    <button class="btn" onclick="alert('Exiting...')">Exit</button>
</div>

</body>
</html>
