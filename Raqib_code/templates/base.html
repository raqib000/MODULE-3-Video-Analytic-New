<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Video Reaction Analyzer{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎥 Video Reaction Analyzer</h1>
            <p>AI-powered analysis of video reactions and liveness detection</p>
        </header>
        
        <main>
            {% block content %}{% endblock %}
        </main>
        
        <footer style="text-align: center; color: white; margin-top: 40px; padding: 20px;">
            <p>&copy; 2024 AI Resume Screener Project. Developed by Your Team.</p>
        </footer>
    </div>
    
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
